[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemops"
version = "1.0.0"
description = "Git-Driven CI/CD Pipeline for Autonomous Laboratory Orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["chemistry", "laboratory", "automation", "devops", "cicd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "anyio>=4.4.0",
    "aiosqlite>=0.20.0",
]
lint = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
]

[project.scripts]
chemops = "chemops.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chemops*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["chemops"]
omit = [
    "tests/*",
    "chemops/api.py",      # requires running FastAPI server — covered in integration
    "chemops/cli.py",      # requires CLI invocation — covered in integration
    "chemops/config.py",   # pydantic settings — tested via env vars in integration
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["chemops", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","SIM","TCH","ANN","PTH","ERA","RUF"]
ignore = [
    # ANN101 and ANN102 were removed from ruff — do NOT list them here,
    # ruff prints a warning for every removed rule in the ignore list.
    "ANN401",  # Dynamically typed expressions (Any) are disallowed — needed in several places
    "ERA001",  # Found commented-out code — allow in tests and config files
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"chemops/cli.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["chemops"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311"]
