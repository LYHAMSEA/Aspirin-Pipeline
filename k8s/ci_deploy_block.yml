# =============================================================================
# CI/CD — Deploy to Kubernetes
# Add this job to .github/workflows/ci.yml AFTER the "build" job.
#
# Required GitHub Secrets:
#   KUBE_CONFIG  -> base64-encoded kubeconfig file
#                   Generate: cat ~/.kube/config | base64 -w 0
#                   (paste the full base64 output as the secret value)
# =============================================================================

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://chemops.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Set image tag from build
        run: |
          cd k8s/base
          # Pin the deployment to the exact image built in the "build" job
          IMAGE_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          sed -i "s/newTag: latest/newTag: ${IMAGE_TAG}/" kustomization.yaml

      - name: Apply manifests
        run: kubectl apply -k k8s/base

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/chemops-api -n chemops --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n chemops
          kubectl get svc -n chemops
