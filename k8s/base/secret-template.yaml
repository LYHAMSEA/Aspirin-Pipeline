# =============================================================================
# SECRET TEMPLATE — DO NOT APPLY THIS FILE DIRECTLY
# DO NOT COMMIT WITH REAL VALUES
#
# This file documents which secrets are required. Create the real secret
# using kubectl (see step 4 in the migration guide) — never store real
# secret values in a YAML file that goes into Git.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: chemops-secrets
  namespace: chemops
type: Opaque
stringData:
  CHEMOPS_SECRET_KEY: "REPLACE_ME_32_char_hex_secret"
  DATABASE_URL: "sqlite+aiosqlite:///./chemops.db"
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_ME_strong_password"
  ALERTMANAGER_SLACK_WEBHOOK_URL: "REPLACE_ME_slack_webhook"
