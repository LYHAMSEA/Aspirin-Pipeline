name: ChemOps CI/CD

on:
  push:
    branches: [work]
    tags: ["v*.*.*"]
  pull_request:
    branches: [work]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Lint — ruff, mypy, bandit, chemops-linter
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ".[lint]"

      - name: Ruff — lint
        run: ruff check chemops/ tests/ --output-format=github --fix

      - name: Ruff — format
        run: ruff format chemops/ tests/

      - name: Commit auto-fixed files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "Nothing to commit" || \
            (git add -A && git commit -m "style: auto-fix ruff lint and format" && git push)

      - name: Ruff — format check
        run: ruff format --check chemops/ tests/

      - name: Mypy — type check
        run: mypy chemops/

      - name: Bandit — security scan
        run: bandit -r chemops/ -c pyproject.toml

      - name: ChemOps protocol linter
        run: python linting/chemops_linter.py chemops/protocols/ --strict

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Test — unit + integration, with coverage
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov=chemops \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration"

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=chemops \
            --cov-report=xml \
            --cov-append \
            -m integration \
            --timeout=120

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == env.PYTHON_VERSION
        with:
          files: coverage.xml
          flags: unittests
          name: chemops-coverage

#=============================================================================
# CI/CD — Docker Build + Push to Docker Hub
# Drop this job into your .github/workflows/ci.yml
# after the existing "test" job.
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME  → your Docker Hub username (LYHAMSEA)
#   DOCKERHUB_TOKEN     → Docker Hub access token (NOT your password)
#                         Create at: hub.docker.com → Account Settings
#                         → Personal Access Tokens → Generate new token
# =============================================================================

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx enables multi-architecture builds (amd64 + arm64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate image tags and labels from Git context
      # On push to main:     lyhamsea/aspirin-pipeline:latest
      # On version tag v1.0: lyhamsea/aspirin-pipeline:1.0.0
      #                      lyhamsea/aspirin-pipeline:1.0
      # On any branch:       lyhamsea/aspirin-pipeline:work (branch name)
      # On any commit:       lyhamsea/aspirin-pipeline:sha-abc1234
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lyhamsea/aspirin-pipeline
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      # Log in to Docker Hub using the access token (not password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push — multi-arch so it runs on cloud VMs and Apple Silicon
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          dockerfile: Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pass build metadata into the image labels
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            GIT_SHA=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          # Cache layers in GitHub Actions cache — dramatically speeds up rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build for both Intel/AMD and ARM — works on any cloud provider
          platforms: linux/amd64,linux/arm64

      # Print a summary to the Actions run page
      - name: Print image summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`lyhamsea/aspirin-pipeline\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull lyhamsea/aspirin-pipeline:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY        

# ─────────────────────────────────────────────────────────────────────────────
# Job 6: Release (tagged versions only)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## ChemOps ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.CHANGES }}

            ### Docker image
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
