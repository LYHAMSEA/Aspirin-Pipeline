name: ChemOps CI/CD

on:
  push:
    branches: [work]
    tags: ["v*.*.*"]
  pull_request:
    branches: [work]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Lint — ruff, mypy, bandit, chemops-linter
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: pip install ".[lint]"

      - name: Ruff — lint
        run: ruff check chemops/ tests/ --select W293 --output-format=github --fix

      - name: Ruff — format check
        run: ruff format --check chemops/ tests/

      - name: Mypy — type check
        run: mypy chemops/

      - name: Bandit — security scan
        run: bandit -r chemops/ -c pyproject.toml

      - name: ChemOps protocol linter
        run: python linting/chemops_linter.py chemops/protocols/ --strict

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Test — unit + integration, with coverage
# ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --cov=chemops \
            --cov-report=xml \
            --cov-report=term-missing \
            -m "not integration"

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            --cov=chemops \
            --cov-report=xml \
            --cov-append \
            -m integration \
            --timeout=120

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == env.PYTHON_VERSION
        with:
          files: coverage.xml
          flags: unittests
          name: chemops-coverage

# ─────────────────────────────────────────────────────────────────────────────
# Job 6: Release (tagged versions only)
# ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## ChemOps ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.CHANGES }}

            ### Docker image
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
